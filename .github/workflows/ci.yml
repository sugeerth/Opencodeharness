name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q -k "not real_opencode"

  end-to-end:
    # The real OpenCode against the scripted model, with AgentDiff validating the traces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g opencode-ai@1.19.3
      - run: pip install -e '.[dev]' git+https://github.com/sugeerth/Agenttracing
      - run: pytest -q
      - run: openagent demo --agentdiff -j 3 -o demo-results
      - run: openagent demo --evolve 3 -j 3 -o demo-results/evolve
      - name: The evolution reaches every task passing
        run: |
          python -c "import json, sys; s = json.load(open('demo-results/evolve/evolution.json'))['stopped']; print(s); sys.exit(s != 'every task passes every run')"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: demo-results

  sandbox:
    # The Docker sandbox end to end: build the runner image, run the demo inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: openagent sandbox build
      - run: pytest -q -k sandbox
      - run: openagent demo --only hello --only fix-average --preset baseline --preset openagent --sandbox docker -o sandbox-results
      - name: Same results as outside the sandbox
        run: |
          python -c "import json, sys; r = {(x['task'], x['strategy']): x['passed'] for x in json.load(open('sandbox-results/results.json'))['results']}; print(r); sys.exit(r != {('hello', 'baseline'): True, ('hello', 'openagent'): True, ('fix-average', 'baseline'): False, ('fix-average', 'openagent'): True})"

  action:
    # The GitHub Action itself (uses: ./), on an example task, against the scripted model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Serve the scripted model
        run: |
          pip install -e .
          nohup openagent sim examples/tasks --env-file sim.env > sim.log 2>&1 &
          for i in $(seq 60); do [ -s sim.env ] && break; sleep 0.5; done
          cat sim.env >> "$GITHUB_ENV"
          cp -r examples/tasks/fix-average/files "$RUNNER_TEMP/ws"
      - id: agent
        uses: ./
        with:
          task-file: ${{ github.workspace }}/examples/tasks/fix-average/prompt.txt
          check: python3 -m unittest discover -s tests -q
          protect: |
            tests/**
          working-directory: ${{ runner.temp }}/ws
      - name: The action reports the passing run
        env:
          PASSED: ${{ steps.agent.outputs.passed }}
          CHANGED: ${{ steps.agent.outputs.changed }}
          SUMMARY: ${{ steps.agent.outputs.summary }}
        run: |
          echo "passed=$PASSED changed=$CHANGED"
          test "$PASSED" = true && test "$CHANGED" = 1
          grep -q "the check passed" "$SUMMARY"
