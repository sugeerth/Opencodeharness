<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Agent</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f7f6f2;--panel:#ffffff;--ink:#1d1d1b;--soft:#66655f;--faint:#9a9890;--line:#e4e2da;--chip:#efede6;
  --accent:#0f6e5f;--accent-ink:#ffffff;--good:#1e7a46;--good-bg:#e5f3ea;--bad:#b3261e;--bad-bg:#fbe9e7;
  --warn:#8a5a00;--warn-bg:#fbf1dc;--info:#2a5db0;--info-bg:#e8eefb;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1c1c1a;--ink:#ecebe6;--soft:#a8a69f;--faint:#77756f;--line:#302f2c;--chip:#272623;
  --accent:#5cc8b2;--accent-ink:#0d1f1b;--good:#6fd39a;--good-bg:#18301f;--bad:#ff8a80;--bad-bg:#3a1c19;
  --warn:#e8bd62;--warn-bg:#352a12;--info:#8fb1ff;--info-bg:#1b2540;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#141413;--panel:#1c1c1a;--ink:#ecebe6;--soft:#a8a69f;--faint:#77756f;--line:#302f2c;--chip:#272623;
  --accent:#5cc8b2;--accent-ink:#0d1f1b;--good:#6fd39a;--good-bg:#18301f;--bad:#ff8a80;--bad-bg:#3a1c19;
  --warn:#e8bd62;--warn-bg:#352a12;--info:#8fb1ff;--info-bg:#1b2540;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 10px;display:flex;align-items:baseline;gap:8px}
.brand b{font-size:17px;letter-spacing:-.01em}.brand span{color:var(--faint);font-size:12px}
nav.actions{display:grid;gap:4px;padding:6px 10px 12px;border-bottom:1px solid var(--line)}
nav.actions a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
nav.actions a:hover,nav.actions a.on{background:var(--chip)}
nav.actions svg{width:16px;height:16px;flex:none;color:var(--soft)}
.jobs-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 6px;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.jobs{overflow:auto;padding:0 10px 16px;flex:1}
.job{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);margin-bottom:2px}
.job:hover,.job.on{background:var(--chip)}
.job .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.job .m{display:flex;gap:6px;align-items:center;color:var(--faint);font-size:12px;margin-top:2px}
main{padding:28px 34px 60px;max-width:1180px;width:100%}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;margin:28px 0 10px}
.sub{color:var(--soft);margin:0 0 20px;max-width:760px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:12.5px;color:var(--soft);font-weight:500}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
.hint{font-size:12px;color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:5px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.passed,.pill.done,.pill.kept{background:var(--good-bg);color:var(--good)}
.pill.failed,.pill.error,.pill.reverted{background:var(--bad-bg);color:var(--bad)}
.pill.running,.pill.queued{background:var(--info-bg);color:var(--info)}
.pill.kind{background:var(--chip);color:var(--soft);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.running .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .k{font-size:12px;color:var(--faint)}.tile .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v.good{color:var(--good)}.tile .v.bad{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--soft);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
pre,.log{font:12.5px/1.55 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.log{max-height:60vh}
.diff .add{color:var(--good)}.diff .del{color:var(--bad)}.diff .hd{color:var(--info);font-weight:600}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--faint);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.bar{height:6px;border-radius:3px;background:var(--chip);min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.cell{display:inline-flex;gap:3px}
.sq{width:16px;height:16px;border-radius:4px;border:0;cursor:pointer;padding:0}
.sq.p{background:var(--good)}.sq.f{background:var(--bad)}.sq.c{background:var(--warn)}
.steps{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.step{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.step summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.step summary::-webkit-details-marker{display:none}
.step .idx{color:var(--faint);font:12px var(--mono);width:22px;text-align:right}
.step .ty{font:11.5px var(--mono);padding:1px 7px;border-radius:5px;background:var(--chip);color:var(--soft)}
.step .nm{font-weight:600}.step .pv{color:var(--soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:0}
.step.check-ok{border-left:3px solid var(--good)}.step.check-bad{border-left:3px solid var(--bad)}
.step.repair{border-left:3px solid var(--info);background:color-mix(in srgb,var(--info-bg) 50%,var(--panel))}
.step.guard{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn-bg) 60%,var(--panel))}
.step.errored{border-left:3px solid var(--bad)}
.step .body{margin-top:8px;display:grid;gap:8px}
.step .body h4{margin:0;font-size:12px;color:var(--faint);font-weight:500}
.banner{border-radius:var(--radius);padding:10px 14px;margin:12px 0;font-size:13.5px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.err{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--info-bg);color:var(--info)}
.empty{color:var(--faint);padding:30px 0;text-align:center}
.gen{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:14px 16px;margin-bottom:10px}
.gen h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:10}
.modal .sheet{background:var(--bg);flex:0 0 min(900px,100vw);min-width:0;height:100%;overflow:auto;padding:22px 26px;border-left:1px solid var(--line)}
.modal .sheet h1{font-size:18px;overflow-wrap:anywhere}
details.ad{margin-top:18px}details.ad summary{cursor:pointer;font-weight:600;font-size:15px;margin-bottom:8px}
.kbd{font:12px var(--mono);background:var(--chip);border-radius:4px;padding:0 5px}
.themeb{margin:auto 14px 14px;align-self:flex-start}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .jobs{max-height:220px}
  main{padding:20px 16px 50px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>Open Agent</b><span>v__VERSION__</span></div>
    <nav class="actions">
      <a href="#/new/run" data-nav="run"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3l9 5-9 5z"/></svg>New run</a>
      <a href="#/new/bench" data-nav="bench"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13V8M8 13V3M13 13V6"/></svg>Benchmark</a>
      <a href="#/new/evolve" data-nav="evolve"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12c2-6 8-6 10-8M10 4h3v3"/></svg>Evolve the harness</a>
      <a href="#/new/demo" data-nav="demo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 2"/></svg>Offline demo</a>
      <a href="#/new/open" data-nav="open"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5h4l1 1.5h7V13H2z"/></svg>Open results</a>
    </nav>
    <div class="jobs-h"><span>Jobs</span><span id="jobcount"></span></div>
    <div class="jobs" id="jobs"></div>
    <button class="btn ghost small themeb" id="theme" title="Toggle light/dark">Theme</button>
  </aside>
  <main id="main"></main>
</div>
<script>
"use strict";
const TOKEN = "__OPENAGENT_TOKEN__";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"X-OpenAgent-Token": TOKEN, "Content-Type": "application/json"},
                               body: body ? JSON.stringify(body) : undefined});
  const data = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
};
let INFO = {}, JOBS = [], timer = null, current = null;
const fmtT = t => t ? new Date(t * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const pill = st => `<span class="pill ${esc(st)}"><span class="dot"></span>${esc(st)}</span>`;
const pct = x => (x * 100).toFixed(0) + "%";

// ---------- theme ----------
try { const t = localStorage.getItem("oa-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("oa-theme", next); } catch (e) {}
};

// ---------- jobs list ----------
async function refreshJobs() {
  try { JOBS = await api("/api/jobs"); } catch (e) { return; }
  $("#jobcount").textContent = JOBS.length || "";
  $("#jobs").innerHTML = JOBS.length ? JOBS.map(j => `
    <a class="job ${current === j.id ? "on" : ""}" href="#/job/${esc(j.id)}">
      <div class="t">${esc(j.title || j.kind)}</div>
      <div class="m">${pill(j.status)}<span class="pill kind">${esc(j.kind)}</span><span>${esc(fmtT(j.created))}</span></div>
    </a>`).join("") : `<div class="empty" style="padding:14px">No jobs yet</div>`;
}

// ---------- forms ----------
const field = (id, label, opts={}) => {
  const v = esc(opts.value ?? ""), ph = esc(opts.ph ?? "");
  let input;
  if (opts.type === "textarea") input = `<textarea id="${id}" placeholder="${ph}">${v}</textarea>`;
  else if (opts.type === "select") input = `<select id="${id}">${opts.options.map(o => `<option ${o === opts.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else input = `<input type="${opts.type || "text"}" id="${id}" value="${v}" placeholder="${ph}">`;
  return `<div class="field ${opts.full ? "full" : ""}"><label for="${id}">${esc(label)}</label>${input}${opts.hint ? `<span class="hint">${opts.hint}</span>` : ""}</div>`;
};
const val = id => { const el = document.getElementById(id); return el ? (el.type === "checkbox" ? el.checked : el.value.trim()) : ""; };
const modelFields = (p="") => field(p+"model", "Model", {ph: "provider/model, e.g. anthropic/claude-sonnet-5-5", hint: "Blank: OpenCode's default model"})
                             + field(p+"binary", "OpenCode binary", {value: "opencode"});
function needsOpencode() {
  return INFO.opencode ? "" : `<div class="banner warn">OpenCode was not found on this machine's PATH. Install it with <span class="kbd">npm i -g opencode-ai</span>, or set the binary path below.</div>`;
}

function viewNewRun(prefill={}) {
  $("#main").innerHTML = `
    <h1>New run</h1>
    <p class="sub">OpenCode works on the task; Open Agent runs your check, sends the failing lines back to the same session until it passes, restores protected files before every check, and stops when the agent stops making progress.</p>
    ${needsOpencode()}
    <div class="card"><div class="grid2">
      ${field("dir", "Repository folder", {value: prefill.dir || INFO.cwd || "", full: true, hint: "The folder the agent works in."})}
      ${field("task", "Task", {type: "textarea", full: true, value: prefill.task || "", ph: "Fix the failing date parsing tests"})}
      ${field("check", "Check command", {value: prefill.check || "", ph: "pytest -q", hint: "Must exit 0 when the task is done. Without it OpenCode runs once, unverified."})}
      ${field("protect", "Protected files", {value: prefill.protect || "", ph: "tests/**", hint: "Comma-separated globs, restored before every check."})}
      ${field("preset", "Preset", {type: "select", options: INFO.presets || ["openagent"], value: prefill.preset || "openagent"})}
      ${field("harness", "Harness file (optional)", {value: prefill.harness || "", ph: "path/to/harness.json", hint: "From an evolution; overrides the preset."})}
      ${modelFields()}
      ${field("rounds", "Repair rounds", {type: "number", value: prefill.rounds || "", ph: "3"})}
      ${field("attempts", "Parallel attempts", {type: "number", value: prefill.attempts || "", ph: "1"})}
      ${field("max_cost", "Cost budget (USD)", {type: "number", ph: "none"})}
      ${field("timeout", "Seconds per OpenCode run", {type: "number", value: "900"})}
      <div class="field full"><label class="check"><input type="checkbox" id="copy" checked> Work in a copy: your folder is not changed, and the diff is shown here</label></div>
      <div class="field full"><label class="check"><input type="checkbox" id="sandbox" ${INFO.docker ? "" : "disabled"}> Run in the Docker sandbox: OpenCode and every check run in a container that sees only the workspace ${INFO.docker ? "(build the image once with <span class='kbd'>openagent sandbox build</span>)" : "(Docker is not available)"}</label></div>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn" id="go">Start run</button><span class="hint" id="err"></span></div></div>`;
  $("#go").onclick = async () => {
    const body = {dir: val("dir"), task: val("task"), check: val("check"), protect: val("protect"), preset: val("preset"),
                  harness: val("harness"), model: val("model"), binary: val("binary"), rounds: val("rounds"),
                  attempts: val("attempts"), max_cost: val("max_cost"), timeout: val("timeout"), copy: val("copy"),
                  sandbox: val("sandbox") ? "docker" : ""};
    if (!body.copy && !confirm("The agent will edit files in " + body.dir + " directly. Continue?")) return;
    submit("/api/run", body);
  };
}

function viewBench() {
  $("#main").innerHTML = `
    <h1>Benchmark</h1>
    <p class="sub">Run strategies against a folder of tasks and compare each with plain OpenCode, task by task, graded by held-out tests where a task has them. Every run is written as an AgentDiff trace.</p>
    ${needsOpencode()}
    <div class="card"><div class="grid2">
      ${field("tasks", "Tasks folder or manifest", {value: INFO.examples || "", full: true, hint: "One folder per task (prompt.txt, files/, task.json), or a manifest .json whose tasks are fetched from GitHub on first use. Make your own with <span class='kbd'>openagent tasks from-git</span>."})}
      ${INFO.realworld ? `<div class="field full"><div class="row"><span class="hint">Real-world benchmarks:</span><button class="btn ghost small" id="rw" type="button">Python: 71 tasks from 7 libraries</button>${INFO.realworld_go ? `<button class="btn ghost small" id="rwgo" type="button">Go: 84 tasks from 8 libraries</button>` : ""}<span class="hint">needs <span class="kbd">pip install pytest freezegun hypothesis</span> and a model</span></div></div>` : ""}
      ${field("only", "Only these tasks", {ph: "comma-separated names; blank for all"})}
      ${field("harness", "Also compare a harness file", {ph: "path/to/harness.json"})}
      <div class="field full"><label>Strategies</label><div class="row">${(INFO.presets || []).map(p => `<label class="check"><input type="checkbox" class="preset" value="${esc(p)}" ${["baseline","openagent"].includes(p) ? "checked" : ""}> ${esc(p)}</label>`).join("")}</div></div>
      ${modelFields()}
      ${field("repeat", "Runs per task", {type: "number", value: "1"})}
      ${field("jobs", "In parallel", {type: "number", value: "2"})}
      <div class="field full"><label class="check"><input type="checkbox" id="agentdiff" ${INFO.agentdiff ? "checked" : "disabled"}> Evaluate with AgentDiff ${INFO.agentdiff ? "" : "(not installed)"}</label></div>
      <div class="field full"><label class="check"><input type="checkbox" id="sandbox" ${INFO.docker ? "" : "disabled"}> Run in the Docker sandbox: OpenCode and every check run in a container that sees only the workspace ${INFO.docker ? "(build the image once with <span class='kbd'>openagent sandbox build</span>)" : "(Docker is not available)"}</label></div>
    </div><div class="row" style="margin-top:16px"><button class="btn" id="go">Start benchmark</button><span class="hint" id="err"></span></div></div>`;
  if ($("#rw")) $("#rw").onclick = () => { document.getElementById("tasks").value = INFO.realworld; };
  if ($("#rwgo")) $("#rwgo").onclick = () => { document.getElementById("tasks").value = INFO.realworld_go; };
  $("#go").onclick = () => submit("/api/bench", {tasks: val("tasks"), only: val("only"), harness: val("harness") || undefined,
    presets: [...document.querySelectorAll(".preset:checked")].map(x => x.value), model: val("model"), binary: val("binary"),
    repeat: val("repeat"), jobs: val("jobs"), agentdiff: val("agentdiff"), sandbox: val("sandbox") ? "docker" : ""});
}

function viewEvolve() {
  $("#main").innerHTML = `
    <h1>Evolve the harness</h1>
    <p class="sub">Signals in the runs propose one change at a time: an instruction, or more repair rounds. A change is kept only if it wins more tasks than it loses, loses none, and holds when the tasks it moved are run again. The result is a harness file you can use for new runs.</p>
    ${needsOpencode()}
    <div class="card"><div class="grid2">
      ${field("tasks", "Tasks folder", {value: INFO.examples || "", full: true})}
      ${field("generations", "Generations at most", {type: "number", value: "5"})}
      ${field("harness", "Start from a harness file", {ph: "blank: the openagent preset"})}
      ${modelFields()}
      ${field("repeat", "Runs per task per arm", {type: "number", value: "2"})}
      ${field("jobs", "In parallel", {type: "number", value: "2"})}
      <div class="field full"><label class="check"><input type="checkbox" id="agentdiff" ${INFO.agentdiff ? "checked" : "disabled"}> Evaluate each generation with AgentDiff ${INFO.agentdiff ? "" : "(not installed)"}</label></div>
    </div><div class="row" style="margin-top:16px"><button class="btn" id="go">Start evolving</button><span class="hint" id="err"></span></div></div>`;
  $("#go").onclick = () => submit("/api/evolve", {tasks: val("tasks"), generations: val("generations"), harness: val("harness") || undefined,
    model: val("model"), binary: val("binary"), repeat: val("repeat"), jobs: val("jobs"), agentdiff: val("agentdiff")});
}

function viewDemo() {
  $("#main").innerHTML = `
    <h1>Offline demo</h1>
    <p class="sub">The whole workflow with no API key: the real OpenCode runs, with its own tools and sessions, against a scripted model served on this machine. Six example tasks each exercise one part of the loop. The playbooks decide the outcomes, so this shows the workflow working, not how good any model is.</p>
    ${needsOpencode()}
    ${INFO.examples_exist ? "" : `<div class="banner warn">The example tasks were not found (${esc(INFO.examples)}). The demo needs a clone of the repository.</div>`}
    <div class="grid2">
      <div class="card"><h2 style="margin-top:0">Benchmark</h2><p class="sub">baseline, guided and openagent on the six tasks, with held-out grading${INFO.agentdiff ? " and AgentDiff" : ""}. About a minute.</p>
        <div class="row">${field("repeat", "Runs per task", {type: "number", value: "1"})}</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="b1">Run the benchmark demo</button></div></div>
      <div class="card"><h2 style="margin-top:0">Evolution</h2><p class="sub">Let the harness improve itself on the same tasks, keeping a change only when it wins and holds on a re-run. A few minutes.</p>
        <div class="row">${field("gens", "Generations", {type: "number", value: "5"})}</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="b2">Run the evolution demo</button></div></div>
    </div><span class="hint" id="err"></span>`;
  $("#b1").onclick = () => submit("/api/demo", {repeat: val("repeat"), jobs: 3, agentdiff: !!INFO.agentdiff});
  $("#b2").onclick = () => submit("/api/demo", {evolve: true, generations: val("gens"), repeat: 1, jobs: 3});
}

function viewOpen() {
  const guess = INFO.examples ? INFO.examples.replace(/examples\/tasks\/?$/, "docs/") : "";
  $("#main").innerHTML = `
    <h1>Open results</h1>
    <p class="sub">Browse a folder written by <span class="kbd">openagent bench</span>, <span class="kbd">demo</span> or <span class="kbd">evolve</span>: the report, every run, and every step of every trace. The folder is only read.</p>
    <div class="card"><div class="grid2">${field("dir", "Results folder", {full: true, value: guess ? guess + "demo" : "", hint: "A folder with results.json or evolution.json."})}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="go">Open</button>
      ${guess ? `<button class="btn ghost" id="q1">The committed demo</button><button class="btn ghost" id="q2">The committed evolution</button>` : ""}
      <span class="hint" id="err"></span></div></div>`;
  $("#go").onclick = () => submit("/api/import", {dir: val("dir")});
  if (guess) { $("#q1").onclick = () => submit("/api/import", {dir: guess + "demo"}); $("#q2").onclick = () => submit("/api/import", {dir: guess + "evolve"}); }
}

async function submit(path, body) {
  const btns = document.querySelectorAll("#main .btn"); btns.forEach(b => b.disabled = true);
  try { const j = await api(path, body); await refreshJobs(); location.hash = "#/job/" + j.id; }
  catch (e) { $("#err").textContent = e.message; $("#err").style.color = "var(--bad)"; btns.forEach(b => b.disabled = false); }
}

// ---------- job view ----------
let jobState = {log: [], total: 0, tab: null};
async function viewJob(id) {
  current = id; jobState = {log: [], total: 0, tab: null, id};
  $("#main").innerHTML = `<div class="empty">Loading…</div>`;
  await pollJob(true);
}
async function pollJob(first=false) {
  const id = jobState.id; if (!id || current !== id) return;
  let j;
  try { j = await api(`/api/jobs/${encodeURIComponent(id)}?since=${jobState.total}`); }
  catch (e) { $("#main").innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
  jobState.log.push(...j.log); jobState.total = j.log_total;
  const changed = first || jobState.status !== j.status;
  jobState.status = j.status; jobState.job = j;
  if (changed) await renderJob(j);
  else { const lg = $("#log"); if (lg) { const atEnd = lg.scrollHeight - lg.scrollTop - lg.clientHeight < 30;
      lg.textContent = jobState.log.join("\n") || "Waiting for output…"; if (atEnd) lg.scrollTop = lg.scrollHeight; } }
  clearTimeout(timer);
  if (["queued", "running"].includes(j.status)) timer = setTimeout(pollJob, 1000);
  else if (changed && !first) refreshJobs();
}

async function renderJob(j) {
  const running = ["queued", "running"].includes(j.status);
  const p = j.params || {};
  let head = `<div class="row" style="justify-content:space-between"><div>
      <div class="row">${pill(j.status)}<span class="pill kind">${esc(j.kind)}</span><span class="hint">${esc(fmtT(j.created))}</span></div>
      <h1 style="margin-top:8px">${esc(j.title)}</h1>
      ${j.kind === "run" ? `<p class="sub" style="margin:0">${esc(p.dir)}${p.check ? ` · check <span class="kbd">${esc(p.check)}</span>` : ""}${p.model ? ` · ${esc(p.model)}` : ""}</p>` : ""}
      ${j.kind === "import" ? `<p class="sub" style="margin:0">${esc(j.dir)}</p>` : ""}
    </div><div class="row">
      ${j.kind === "run" && !running ? `<button class="btn ghost small" id="again">Run again</button>` : ""}
      ${!running ? `<button class="btn ghost small" id="del">Remove</button>` : ""}
    </div></div>`;
  if (j.summary && j.summary.error) head += `<div class="banner err">${esc(j.summary.error)}</div>`;
  let tabs = [], body = "";
  if (j.kind === "run") {
    const s = j.summary || {};
    if (!running && s.passed !== undefined) head += `<div class="tiles">
      <div class="tile"><div class="k">Result</div><div class="v ${s.passed ? "good" : "bad"}">${s.passed ? "passed" : "failed"}</div></div>
      <div class="tile"><div class="k">How it ended</div><div class="v">${esc(s.stop || "")}</div></div>
      <div class="tile"><div class="k">Repairs</div><div class="v">${esc(s.repairs)}</div></div>
      <div class="tile"><div class="k">Files changed</div><div class="v">${(s.files || []).length}</div></div>
      <div class="tile"><div class="k">Tokens</div><div class="v">${Number(s.tokens || 0).toLocaleString()}</div></div>
      <div class="tile"><div class="k">Cost</div><div class="v">$${Number(s.cost || 0).toFixed(4)}</div></div>
      <div class="tile"><div class="k">Time</div><div class="v">${esc(s.seconds)}s</div></div></div>`;
    tabs = running ? ["Live log"] : ["Trace", "Diff", "Summary", "Log"];
  } else if (j.summary && j.summary.evolution) tabs = running ? ["Live log"] : ["Evolution", "Harness", "Log"];
  else tabs = running ? ["Live log"] : ["Results", "Log"];
  if (!jobState.tab || !tabs.includes(jobState.tab)) jobState.tab = tabs[0];
  $("#main").innerHTML = head + `<div class="tabs">${tabs.map(t => `<button data-tab="${t}" class="${t === jobState.tab ? "on" : ""}">${t}</button>`).join("")}</div><div id="pane"></div>`;
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { jobState.tab = b.dataset.tab; renderJob(jobState.job); });
  if ($("#del")) $("#del").onclick = async () => { if (!confirm("Remove this job" + (j.kind === "import" ? " from the list? The folder itself is kept." : " and its files?"))) return;
    await api(`/api/jobs/${encodeURIComponent(j.id)}/delete`, {}); current = null; await refreshJobs(); location.hash = "#/new/run"; };
  if ($("#again")) $("#again").onclick = () => { location.hash = "#/new/run"; setTimeout(() => viewNewRun(p), 0); };
  await renderPane(j);
  refreshJobs();
}

async function renderPane(j) {
  const pane = $("#pane"), tab = jobState.tab;
  if (tab === "Live log" || tab === "Log") {
    pane.innerHTML = `<div class="log" id="log"></div>`;
    $("#log").textContent = jobState.log.join("\n") || "Waiting for output…";
    $("#log").scrollTop = 1e9;
  } else if (tab === "Trace") {
    pane.innerHTML = await traceHTML(j.id, j.summary.trace);
  } else if (tab === "Diff") {
    let d = ""; try { d = await api(`/api/jobs/${encodeURIComponent(j.id)}/file?path=diff.patch`); } catch (e) {}
    pane.innerHTML = d.trim() ? `<pre class="diff">${d.split("\n").map(l => {
      const c = l.startsWith("+++") || l.startsWith("---") || l.startsWith("@@") ? "hd" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
      return c ? `<span class="${c}">${esc(l)}</span>` : esc(l); }).join("\n")}</pre>`
      : `<div class="empty">${j.params.copy === false ? "No diff: the run worked in place and the folder is not a git repository, or nothing changed." : "Nothing changed."}</div>`;
  } else if (tab === "Summary") {
    let m = ""; try { m = await api(`/api/jobs/${encodeURIComponent(j.id)}/file?path=summary.md`); } catch (e) {}
    pane.innerHTML = m ? `<p class="sub">The run as Markdown, ready for a pull request body (the same text <code>openagent run --summary</code> writes).</p>
      <div class="row" style="margin-bottom:10px"><button class="btn" id="copymd">Copy Markdown</button></div><pre id="md">${esc(m)}</pre>`
      : `<div class="empty">No summary for this run.</div>`;
    if ($("#copymd")) $("#copymd").onclick = async () => { try { await navigator.clipboard.writeText(m); $("#copymd").textContent = "Copied"; } catch (e) { $("#copymd").textContent = "Select the text below to copy"; } };
  } else if (tab === "Results") {
    pane.innerHTML = await resultsHTML(j);
    bindCells(j);
  } else if (tab === "Evolution") {
    pane.innerHTML = await evolutionHTML(j);
  } else if (tab === "Harness") {
    let h = {}; try { h = await api(`/api/jobs/${encodeURIComponent(j.id)}/file?path=harness.json`); } catch (e) {}
    const path = j.dir.replace(/\/$/, "") + "/harness.json";
    pane.innerHTML = `<p class="sub">The evolved harness. Use it for new runs, or compare it in a benchmark.</p>
      <pre>${esc(JSON.stringify(h, null, 2))}</pre>
      <div class="row" style="margin-top:12px"><button class="btn" id="use">Start a run with this harness</button><span class="hint">${esc(path)}</span></div>`;
    $("#use").onclick = () => { location.hash = "#/new/run"; setTimeout(() => viewNewRun({harness: path}), 0); };
  }
}

// ---------- trace ----------
async function traceHTML(jid, path) {
  let t; try { t = await api(`/api/jobs/${encodeURIComponent(jid)}/file?path=${encodeURIComponent(path)}`); }
  catch (e) { return `<div class="empty">No trace: ${esc(e.message)}</div>`; }
  const h = t.harness || {};
  const top = `<div class="row" style="margin-bottom:10px">
      <span class="pill ${t.outcome.success ? "passed" : "failed"}">${t.outcome.success ? "success" : "failure"}</span>
      <span class="pill kind">${esc(t.agent.name)}</span><span class="pill kind">${esc(t.agent.model)}</span>
      <span class="hint">${t.steps.length} steps · ${Number(t.totals.input_tokens + t.totals.output_tokens).toLocaleString()} tokens · ${esc(h.stop || "")}${h.note ? " · synthetic" : ""}</span></div>
      <p class="sub" style="margin:0 0 12px">${esc(t.outcome.answer)}</p>`;
  return top + `<div class="steps">${t.steps.map(stepHTML).join("")}</div>
    <p class="hint" style="margin-top:12px">AgentDiff trace (SCHEMA v1): <span class="kbd">${esc(path)}</span></p>`;
}
function stepHTML(s) {
  let cls = "";
  if (s.name === "openagent.check") cls = (s.output || "").startsWith("exit 0") ? "check-ok" : "check-bad";
  else if (s.name === "openagent.repair") cls = "repair";
  else if (s.name === "openagent.guard") cls = "guard";
  else if (s.error) cls = "errored";
  const preview = (s.output || s.input || "").replace(/\s+/g, " ").slice(0, 160);
  const label = {"openagent.check": "check", "openagent.repair": "repair", "openagent.guard": "guard"}[s.name] || s.name;
  return `<details class="step ${cls}"><summary><span class="idx">${s.index}</span><span class="ty">${esc(s.type)}</span>
      <span class="nm">${esc(label)}</span><span class="pv">${esc(preview)}</span>${s.tokens ? `<span class="hint">${Number(s.tokens).toLocaleString()} tok</span>` : ""}</summary>
    <div class="body">${s.input ? `<h4>Input</h4><pre>${esc(s.input)}</pre>` : ""}${s.output ? `<h4>Output</h4><pre>${esc(s.output)}</pre>` : ""}
    ${s.note ? `<span class="hint">${esc(s.note)}</span>` : ""}</div></details>`;
}

// ---------- results ----------
async function resultsHTML(j) {
  let d; try { d = await api(`/api/jobs/${encodeURIComponent(j.id)}/file?path=results.json`); }
  catch (e) { return `<div class="empty">No results.json: ${esc(e.message)}</div>`; }
  jobState.results = d;
  const base = d.summary.find(s => s.strategy === "baseline");
  const graded = d.summary.some(s => s.graded_runs);
  let h = d.meta.synthetic ? `<div class="banner warn"><b>Synthetic run.</b> ${esc(d.meta.synthetic)}</div>` : "";
  h += `<p class="hint">Model ${esc(d.meta.model || "OpenCode default")} · ${esc(d.meta.tasks)} tasks · ${esc(d.meta.repeat)} run(s) each · ${esc(d.meta.date)}</p>`;
  h += `<div class="tablewrap"><table><thead><tr><th>Strategy</th><th>Pass rate</th><th></th><th>Δ vs baseline</th>${graded ? "<th>Visible check</th>" : ""}<th>Avg repairs</th><th>Avg tokens</th><th>Avg time</th><th>How runs ended</th></tr></thead><tbody>` +
    d.summary.map(s => `<tr><td><b>${esc(s.strategy)}</b></td><td>${pct(s.pass_rate)} <span class="hint">${s.passed}/${s.runs}</span></td>
      <td><div class="bar"><i style="width:${pct(s.pass_rate)}"></i></div></td>
      <td>${!base || s === base ? "—" : `<span class="${s.pass_rate > base.pass_rate ? "up" : s.pass_rate < base.pass_rate ? "down" : ""}">${((s.pass_rate - base.pass_rate) * 100).toFixed(0) > 0 ? "+" : ""}${((s.pass_rate - base.pass_rate) * 100).toFixed(0)} pts</span>`}</td>
      ${graded ? `<td>${s.check_passed}/${s.runs}</td>` : ""}<td>${s.avg_repairs.toFixed(2)}</td><td>${Math.round(s.avg_tokens).toLocaleString()}</td><td>${s.avg_seconds.toFixed(0)}s</td>
      <td class="hint">${Object.entries(s.stops).map(([k, v]) => `${esc(k)} ${v}`).join(", ")}</td></tr>`).join("") + `</tbody></table></div>`;
  if ((d.paired || []).length) {
    h += `<h2>Against baseline, task by task</h2><p class="hint">AgentDiff's rule for a harness change: keep it only if it wins more tasks than it loses and loses none.</p>
      <div class="tablewrap"><table><thead><tr><th>Strategy</th><th>Wins</th><th>Losses</th><th>Ties</th><th>Sign test p</th><th>Verdict</th></tr></thead><tbody>` +
      d.paired.map(r => `<tr><td><b>${esc(r.strategy)}</b></td><td class="up">${esc(r.wins.join(", ") || "—")}</td><td class="down">${esc(r.losses.join(", ") || "—")}</td>
        <td>${r.ties.length}</td><td>${r.sign_test_p == null ? "—" : r.sign_test_p.toFixed(3)}</td>
        <td><span class="pill ${r.verdict === "keep" ? "kept" : r.verdict === "revert" ? "reverted" : "kind"}">${esc(r.verdict)}</span></td></tr>`).join("") + `</tbody></table></div>`;
  }
  const strategies = d.summary.map(s => s.strategy), tasks = [...new Set(d.results.map(r => r.task))].sort();
  h += `<h2>Every run</h2><p class="hint">Green passed, red failed, amber passed the visible check but failed the held-out grade. Click a square to read its trace.</p>
    <div class="tablewrap"><table><thead><tr><th>Task</th>${strategies.map(s => `<th>${esc(s)}</th>`).join("")}</tr></thead><tbody>` +
    tasks.map(t => `<tr><td>${esc(t)}</td>${strategies.map(s => `<td><span class="cell">${d.results.filter(r => r.task === t && r.strategy === s).map(r =>
      `<button class="sq ${r.passed ? "p" : r.check_passed && r.graded === false ? "c" : "f"}" data-trace="${esc(r.trace || "")}" title="${esc(`${t} · ${s} · run ${r.repeat + 1}: ${r.passed ? "passed" : r.check_passed && r.graded === false ? "passed the check, failed the held-out grade" : "failed"}${r.stop && r.stop !== "passed" ? ` (${r.stop})` : ""}`)}"></button>`).join("")}</span></td>`).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
  for (const a of d.agentdiff || []) {
    const first = (a.error || a.summary || "").split("\n").find(l => l.startsWith("Paired inference")) || a.error || "";
    h += `<details class="ad"><summary>AgentDiff: ${esc(a.pair)}</summary><pre>${esc(a.error || a.summary)}</pre></details>
          <p class="hint" style="margin:4px 0 0">${esc(first)}</p>`;
  }
  return h;
}
function bindCells(j) {
  document.querySelectorAll(".sq[data-trace]").forEach(b => b.onclick = async () => {
    if (!b.dataset.trace) return;
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="sheet"><div class="row" style="justify-content:space-between"><h1>${esc(b.title)}</h1><button class="btn ghost small" id="close">Close</button></div><div id="tr">Loading…</div></div>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    m.onclick = e => { if (e.target === m) close(); }; $("#close", m).onclick = close;
    document.addEventListener("keydown", function k(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", k); } });
    $("#tr", m).innerHTML = await traceHTML(j.id, b.dataset.trace);
  });
}

// ---------- evolution ----------
async function evolutionHTML(j) {
  let e; try { e = await api(`/api/jobs/${encodeURIComponent(j.id)}/file?path=evolution.json`); }
  catch (err) { return `<div class="empty">No evolution.json: ${esc(err.message)}</div>`; }
  const baseN = (e.base.instructions || []).length;
  let h = e.synthetic ? `<div class="banner warn"><b>Synthetic run.</b> ${esc(e.synthetic)}</div>` : "";
  h += `<p class="hint">Model ${esc(e.model || "OpenCode default")} · ${e.tasks.length} tasks · ${e.repeat} run(s) per task per arm · stopped: ${esc(e.stopped || "")}</p>`;
  h += `<h2>Lineage</h2><div class="tablewrap"><table><thead><tr><th>Version</th><th>Tasks passing</th><th></th><th>Instructions added</th></tr></thead><tbody>` +
    (e.history || []).map(v => { const n = Object.values(v.rates).reduce((a, b) => a + b, 0), tot = Object.keys(v.rates).length;
      return `<tr><td><b>${esc(v.version)}</b></td><td>${+n.toFixed(2)}/${tot}</td><td><div class="bar"><i style="width:${tot ? pct(n / tot) : 0}"></i></div></td>
        <td>${v.harness.instructions.slice(baseN).map(i => `<div class="hint">• ${esc(i)}</div>`).join("") || "—"}</td></tr>`; }).join("") + `</tbody></table></div>`;
  h += `<h2>Generations</h2>` + (e.generations.length ? e.generations.map(g => {
    const tasks = Object.keys(g.rates.current).sort();
    return `<div class="gen"><h3>Generation ${g.generation}: <span class="kbd">${esc(g.candidate)}</span> <span class="pill ${esc(g.verdict)}">${esc(g.verdict)}</span></h3>
      <div class="hint">Proposed by <b>${esc(g.signal)}</b> on ${esc(g.proposed_by.join(", "))}: ${esc(g.why)}.</div>
      <p style="margin:8px 0">${g.instruction ? `Adds: “${esc(g.instruction)}”` : `Adds ${g.rounds_added} repair round(s).`}</p>
      <div class="hint">Against ${esc(g.current)}: won ${esc(g.wins.join(", ") || "nothing")}; lost ${esc(g.losses.join(", ") || "nothing")}${g.confirm ? `; re-run of ${esc(g.confirm.tasks.join(", "))}: won ${esc(g.confirm.wins.join(", ") || "nothing")}, lost ${esc(g.confirm.losses.join(", ") || "nothing")}` : ""}. <b>${esc(g.reason)}</b>.</div>
      <div class="row" style="margin-top:8px">${tasks.map(t => { const a = g.rates.current[t], b = g.rates.candidate[t];
        return `<span class="pill kind">${esc(t)} ${pct(a)} → ${pct(b)} ${b > a ? '<span class="up">▲</span>' : b < a ? '<span class="down">▼</span>' : ""}</span>`; }).join("")}</div></div>`; }).join("")
    : `<div class="empty">No generations ran.</div>`);
  return h;
}

// ---------- router ----------
function route() {
  clearTimeout(timer);
  const h = location.hash.replace(/^#\/?/, "");
  const [a, b] = h.split("/");
  document.querySelectorAll("nav.actions a").forEach(x => x.classList.toggle("on", a === "new" && x.dataset.nav === b));
  if (a === "job" && b) return viewJob(decodeURIComponent(b));
  current = null; refreshJobs();
  ({bench: viewBench, evolve: viewEvolve, demo: viewDemo, open: viewOpen}[b] || viewNewRun)();
}
window.addEventListener("hashchange", route);
(async () => {
  try { INFO = await api("/api/info"); } catch (e) { $("#main").innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
  await refreshJobs(); route();
  setInterval(() => { if (JOBS.some(j => ["queued", "running"].includes(j.status))) refreshJobs(); }, 3000);
})();
</script>
</body>
</html>
