[project]
name = "openagent-harness"
version = "0.7.0"
description = "Open Agent: make OpenCode verify and repair its own work, with best-of-N and benchmarks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sugeerth Murugesan" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["opencode", "coding-agent", "agent-harness", "llm", "benchmark"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/sugeerth/Opencodeharness"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
openagent = "openagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openagent = ["ui/*.html", "docker/Dockerfile"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
