[project]
name = "opencodeharness"
version = "0.1.0"
description = "A minimal open-source coding-agent harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ocharness = "opencodeharness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
